name: checks
on:
  push:
    branches: [main]
  pull_request:
jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Every Python file compiles
        run: python -m compileall -q weather_bench panorama
      - name: Weather bench tests (no hardware)
        run: python -m unittest discover -s tests -v
